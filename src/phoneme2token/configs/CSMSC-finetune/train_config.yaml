data_dir: data/
dataset: CSMSC
valid_frames_csv: valid_frames_p2t.csv
learning_rate: 1.0e-5
effective_batch_size: 64
batch_size_unit: sample
accumulation_steps: 4
num_epochs: 20
warmup_ratio: 0.1
lr_scheduler_type: cosine
exp_name: CSMSC-finetune
output_dir: results/phoneme2token/${exp_name}
save_steps: 500
save_total_limit: 3
logging_steps: 20
eval_accumulation_steps: 100
seed: 42
fp16: true
bf16: false
tf32: true
num_workers: 4
length_bucketing: true
length_bucket_multiplier: 50
grad_clip: 1.0
resume: false
finetune_from_checkpoint: results/phoneme2token/AISHELL-2-95_5/checkpoint-37000
